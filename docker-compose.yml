# SubLearn: два модуля
#   ollama — модель (CPU в Docker VM; на Mac Metal см. ниже)
#   web    — API, статика, HLS-прокси
#
# Запуск:  ./start.sh   или   docker compose up -d --build
# Стоп:    docker compose down
# Логи:    docker compose logs -f web ollama
# Чистка моделей: docker compose down -v
#
# Опционально быстрее на Mac (Metal): поставьте Ollama.app, pull qwen3:4b,
# затем поднимите только web:
#   docker compose up -d --build web
#   # и в environment web:
#   # SUBLEARN_OLLAMA_URL: http://host.docker.internal:11434
#   # (сервис ollama можно остановить: docker compose stop ollama)

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 3m = тёплый idle: после AI/prefetch модель в RAM ~3 мин, потом сама выгружается.
      OLLAMA_KEEP_ALIVE: "3m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # Не публикуем 11434 на хост по умолчанию — только внутренняя сеть compose.
    expose:
      - "11434"
    # ИИ только по кнопке; 4B холодная — Google основной путь.
    cpus: "2.0"
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8765:8765"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - vocab_data:/app/data
      - ./server.py:/app/server.py
      - ./app.js:/app/app.js
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./ad-skip.js:/app/ad-skip.js
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      SUBLEARN_OLLAMA_URL: http://ollama:11434
      # 4B — баланс скорость/качество; клики идут через Google.
      SUBLEARN_OLLAMA_MODEL: qwen3:4b
      SUBLEARN_OLLAMA_NUM_THREAD: "2"
      SUBLEARN_HOST: 0.0.0.0
      SUBLEARN_PORT: "8765"
      SUBLEARN_DATA_DIR: /app/data
      SUBLEARN_NEWDEAF_DNS: cloudflare
      # Тёплый idle 3м после AI/prefetch; Google — основной путь перевода.
      OLLAMA_KEEP_ALIVE: "3m"
    depends_on:
      ollama:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped

volumes:
  ollama_data:
  vocab_data:
