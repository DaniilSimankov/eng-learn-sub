# SubLearn + локальная модель (Ollama) в одном контейнере
# Запуск: ./start.sh   или   docker compose up -d --build
# Стоп:   docker compose down
# Чистка модели: docker compose down -v
#
# Память: реплики qwen3:4b (~2.5–3 GB) + слова qwen3:1.7b (~1.2 GB).
# OLLAMA_MAX_LOADED_MODELS=2 — обе в RAM без thrashing при кликах.
# Если мало RAM — одна модель на всё:
#   SUBLEARN_OLLAMA_MODEL=qwen3:4b
#   SUBLEARN_OLLAMA_WORD_MODEL=qwen3:4b
#   OLLAMA_MAX_LOADED_MODELS=1
#   mem_limit: 4g

services:
  sublearn:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ollama_data:/root/.ollama
      - vocab_data:/app/data
      - ./server.py:/app/server.py
      - ./app.js:/app/app.js
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./ad-skip.js:/app/ad-skip.js
    environment:
      SUBLEARN_OLLAMA_URL: http://127.0.0.1:11434
      # Реплики — умнее; слова — легче и быстрее.
      SUBLEARN_OLLAMA_MODEL: qwen3:4b
      SUBLEARN_OLLAMA_WORD_MODEL: qwen3:1.7b
      SUBLEARN_OLLAMA_NUM_THREAD: "4"
      SUBLEARN_HOST: 0.0.0.0
      SUBLEARN_PORT: "8765"
      SUBLEARN_DATA_DIR: /app/data
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    mem_limit: 6g
    cpus: "4.0"
    restart: unless-stopped

volumes:
  ollama_data:
  vocab_data:
