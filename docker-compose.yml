# SubLearn: два модуля
#   ollama — модель (CPU в Docker VM; на Mac Metal см. ниже)
#   web    — API, статика, HLS-прокси
#
# Запуск:  ./start.sh   или   docker compose up -d --build
# Стоп:    docker compose down
# Логи:    docker compose logs -f web ollama
# Чистка моделей: docker compose down -v
#
# Опционально быстрее на Mac (Metal): поставьте Ollama.app, pull qwen2.5:7b,
# затем поднимите только web:
#   docker compose up -d --build web
#   # и в environment web:
#   # SUBLEARN_OLLAMA_URL: http://host.docker.internal:11434
#   # (сервис ollama можно остановить: docker compose stop ollama)

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 0 = сразу выгружать модель из RAM после ответа (ИИ «спит», пока не нажмут кнопку).
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # Не публикуем 11434 на хост по умолчанию — только внутренняя сеть compose.
    expose:
      - "11434"
    # ИИ только по кнопке «ИИ · разбор» — можно держать 7B; Google остаётся быстрым путём.
    cpus: "2.5"
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - vocab_data:/app/data
      - ./server.py:/app/server.py
      - ./app.js:/app/app.js
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./ad-skip.js:/app/ad-skip.js
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      SUBLEARN_OLLAMA_URL: http://ollama:11434
      # 7B лучше держит сленг/контекст; клики по словам идут через Google.
      SUBLEARN_OLLAMA_MODEL: qwen2.5:7b
      SUBLEARN_OLLAMA_NUM_THREAD: "2"
      SUBLEARN_HOST: 0.0.0.0
      SUBLEARN_PORT: "8765"
      SUBLEARN_DATA_DIR: /app/data
      # Не держать 7B в RAM: Google — основной путь, ИИ грузится только по кнопке.
      OLLAMA_KEEP_ALIVE: "0"
    depends_on:
      ollama:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped

volumes:
  ollama_data:
  vocab_data:
