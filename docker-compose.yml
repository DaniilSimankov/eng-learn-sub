# SubLearn + локальная модель (Ollama) в одном контейнере
# Запуск: ./start.sh   или   docker compose up -d --build
# Стоп:   docker compose down
# Чистка модели: docker compose down -v
#
# Одна универсальная модель в RAM. «Два агента» = разные промпты/лимиты:
#   слова — короткий словарь (num_ctx=256), фразы — полный перевод (num_ctx=1024).
# qwen3:4b требует think:false в API (иначе content пустой).

services:
  sublearn:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ollama_data:/root/.ollama
      - vocab_data:/app/data
      - ./server.py:/app/server.py
      - ./app.js:/app/app.js
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./ad-skip.js:/app/ad-skip.js
    environment:
      SUBLEARN_OLLAMA_URL: http://127.0.0.1:11434
      SUBLEARN_OLLAMA_MODEL: qwen3:4b
      SUBLEARN_OLLAMA_NUM_THREAD: "4"
      SUBLEARN_HOST: 0.0.0.0
      SUBLEARN_PORT: "8765"
      SUBLEARN_DATA_DIR: /app/data
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    mem_limit: 4g
    cpus: "4.0"
    restart: unless-stopped

volumes:
  ollama_data:
  vocab_data:
